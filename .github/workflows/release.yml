name: Publish extension ZIP

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check JavaScript syntax
        run: |
          for file in background.js content.js popup.js lib/*.js; do
            node --check "$file"
          done

      - name: Verify tag matches manifest version
        shell: bash
        run: |
          version=$(python -c 'import json; print(json.load(open("manifest.json"))["version"])')
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Build extension ZIP
        run: python scripts/package_extension.py

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="dist/Monash-Moodle-Downloader-${GITHUB_REF_NAME}.zip"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$asset" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$asset" \
              --title "Monash Moodle Downloader ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
